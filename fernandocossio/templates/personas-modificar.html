{extends file="layout.html"}{block name="cuerpo"}<section class="formulario"><p><a href="personas.php">← Volver al listado</a></p><h2>Modificar amigo</h2>{if $errores}<div class="aviso error"><ul>{section name=i loop=$errores}<li>{$errores[i]}</li>{/section}</ul></div>{/if}<form action="personas.php?opcion=30" method="post" enctype="multipart/form-data"><input type="hidden" name="cod" value="{$persona.per_cod}"><label>Código<input value="{$persona.per_cod}" disabled></label><label>Nombre *<input name="nom" required minlength="3" maxlength="150" value="{$persona.per_nom|escape}"></label><div class="dos-columnas"><label>Teléfono *<input name="tel" required pattern="[0-9 +()\-]{7,17}" value="{$persona.per_telf|escape}"></label><label>Celular *<input name="cel" required pattern="[0-9 +()\-]{7,17}" value="{$persona.per_cel|escape}"></label></div><label>Correo electrónico *<input name="email" type="email" required value="{$persona.per_email|escape}"></label><div class="foto-campo"><img class="foto-actual" src="{$foto}" alt="Fotografía actual"><label>Nueva fotografía<input name="foto" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png"><small>Solo JPG o PNG, máximo 3 MB.</small></label></div><button class="boton" type="submit">Actualizar datos</button></form></section>{/block}
